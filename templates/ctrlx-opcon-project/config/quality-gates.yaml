schema_version: 1

compile:
  required_error_count: 0
  warning_policy: signature_allowlist
  warning_signature_fields: [code, object, position]
  warning_allowlist: []
  require_warning_signature_review: true

ownership:
  fail_if_ai_object_missing: true
  fail_if_required_hook_missing: true
  require_dry_run_before_write: true
  require_readback_after_write: true

cpstudio:
  require_clean_export: true
  require_build_after_published_symbol_change: true
  require_build_then_second_export_for_new_symbols: conditional_on_missing_symbol_or_postprocessing_failure
  prohibit_symbol_access_during_export: true

post_export_stage2:
  mode: plan_only_operation_ledger
  operation_root: data/operations/cpstudio-stage2
  allowed_states:
    - WAITING_FOR_RUNNER
    - WAITING_FOR_CPSTUDIO
    - WAITING_FOR_EXPORT_2
    - DONE
    - BLOCKED
    - FAILED
  require_successful_stage1_report: true
  require_action_hash_bound_evidence: true
  require_configured_station_and_plc_match: true
  require_unique_persistent_codex_runner: true
  prohibit_coordinator_starting_ple_mcp_rest: true
  prohibit_online_operations: true
  prohibit_second_ple: true
  second_export_policy: conditional_on_recorded_symbol_or_postprocessing_evidence

plc:
  prohibit_direct_project_byte_edits: true
  require_single_business_writer_for_physical_outputs: true
  require_chain_finish_cleanup_for_active_commands: true
  require_io_mapping_and_symbol_consistency: true

online:
  require_user_approval_for_physical_connect: true
  require_user_approval_for_download: true
  require_user_approval_for_start_stop: true
  require_user_approval_for_force_write: true
